name: Base propia de Jarvis

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Base Python y paquete (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Preparar Python y dependencias de desarrollo
        id: dependencies
        run: uv sync --locked --group dev --python 3.11
      - name: Comprobar pureza de la base
        run: uv run --no-sync python script/check_clean_base.py
      - name: Ruff
        run: uv run --no-sync ruff check --no-cache src tests script
      - name: Preparar el modelo CPU público fijado para cualificación real
        id: memory_model
        shell: bash
        run: |
          JARVIS_MODEL_TEST_ROOT="$(mktemp -d "$RUNNER_TEMP/jarvis-minilm.XXXXXX")"
          echo "JARVIS_MINILM_TEST_ASSETS=$JARVIS_MODEL_TEST_ROOT/artifacts" >> "$GITHUB_ENV"
          .venv/bin/python -B script/prepare_memory_model.py \
            --directory "$JARVIS_MODEL_TEST_ROOT/artifacts"
      - name: Compilar y cualificar bundle nativo autocontenido
        if: runner.os == 'macOS'
        env:
          JARVIS_BUILD_QA_LAUNCHER: "1"
        run: |
          ./script/build_desktop.sh --full --self-contained --deadline 1200 \
            --budget-mib 8192 --output /private/tmp/jarvis-ci-desktop
      - name: Preparar bundle trazable para comprobación nativa
        if: runner.os == 'macOS'
        shell: bash
        run: |
          tar -czf "$RUNNER_TEMP/Jarvis-macos-arm64.tar.gz" -C /private/tmp/jarvis-ci-desktop Jarvis.app
          .venv/bin/python -B - <<'PY'
          import hashlib, json, os, plistlib
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          package = root / "Jarvis-macos-arm64.tar.gz"
          binary = Path("/private/tmp/jarvis-ci-desktop/Jarvis.app/Contents/MacOS/Jarvis")
          qa_launcher = Path("/private/tmp/jarvis-ci-desktop/Jarvis.app/Contents/Helpers/JarvisQALauncher")
          resources = binary.parent.parent / "Resources"
          info = plistlib.loads((binary.parent.parent / "Info.plist").read_bytes())
          report = json.loads((resources / "JarvisRuntimeQualification.json").read_bytes())
          assert info["JarvisDistributionChannel"] == "self-contained"
          assert report["source_commit"] == os.environ["GITHUB_SHA"]
          assert report["parent_eof_clean_shutdown"] and report["official_codex_empty_account"]
          assert report["swift_manifest_admitted"]
          with package.open("rb") as stream:
              archive_hash = hashlib.file_digest(stream, "sha256").hexdigest()
          value = {"format": "jarvis-desktop-ci/2", "commit": os.environ["GITHUB_SHA"],
                   "run_id": os.environ["GITHUB_RUN_ID"], "development_bundle": False,
                   "external_python_required": False, "external_codex_required": False,
                   "architecture": "arm64", "signing": "ad-hoc-ci", "notarized": False,
                   "archive_bytes": package.stat().st_size,
                   "runtime_manifest_sha256": info["JarvisRuntimeManifestSHA256"],
                   "qualification": report, "archive_sha256": archive_hash,
                   "binary_sha256": hashlib.sha256(binary.read_bytes()).hexdigest(),
                   "qa_launcher_bundled": qa_launcher.is_file()}
          if qa_launcher.is_file():
              value["qa_launcher_sha256"] = hashlib.sha256(qa_launcher.read_bytes()).hexdigest()
          (root / "Jarvis-provenance.json").write_text(json.dumps(value, sort_keys=True) + "\n")
          PY
      - name: Conservar bundle autocontenido sin perfiles ni credenciales
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-desktop-${{ github.sha }}
          path: |
            ${{ runner.temp }}/Jarvis-macos-arm64.tar.gz
            ${{ runner.temp }}/Jarvis-provenance.json
          if-no-files-found: error
          retention-days: 3
      - name: Pruebas Swift
        id: native_contracts
        if: ${{ !cancelled() && runner.os == 'macOS' && steps.dependencies.outcome == 'success' && steps.memory_model.outcome == 'success' }}
        run: ./script/test_desktop.sh --full --budget-mib 6144
      - name: Pruebas de contratos propios
        id: contracts
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.memory_model.outcome == 'success' }}
        run: >-
          .venv/bin/python -B script/test_resource_guard.py run
          --profile ci --kind python --selection tests --full
          --minilm-test-assets "$JARVIS_MINILM_TEST_ASSETS"
          --budget-mib 12288 --deadline 1800 --
          .venv/bin/python -B -m pytest -o addopts= -q tests
      - name: Construir el paquete propio
        id: python_package
        if: ${{ !cancelled() && steps.contracts.outcome == 'success' }}
        shell: bash
        run: |
          uv build --offline --sdist --out-dir dist
          sdists=(dist/*.tar.gz)
          test "${#sdists[@]}" -eq 1
          uv build --offline --wheel "${sdists[0]}" --out-dir dist
      - name: Validar artefactos e instalación aislada sin red
        if: ${{ !cancelled() && steps.python_package.outcome == 'success' }}
        shell: bash
        run: |
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          test "${#wheels[@]}" -eq 1
          test "${#sdists[@]}" -eq 1
          uv run --no-sync python script/check_clean_base.py \
            --wheel "${wheels[0]}" --sdist "${sdists[0]}" --smoke
