name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Allows a fresh attempt after hosted macOS capacity is restored.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python lint and tests
    # The daemon relies on Darwin-only APIs (LOCAL_PEERCRED, Keychain paths).
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install Python 3.11
        run: uv python install 3.11
      - name: Sync dependencies
        run: uv sync --locked --group dev --python 3.11
      - name: Ruff
        run: uv run ruff check src tests
      - name: Pytest
        run: uv run pytest -q

  swift:
    name: Swift core tests
    runs-on: macos-26
    timeout-minutes: 45
    env:
      AEGIS_SWIFT_TEST_SCOPE: core
    defaults:
      run:
        working-directory: native/AegisAudio
    steps:
      - uses: actions/checkout@v5
      - name: Select latest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      # This job's scope is the complete core suite. `swift test` alone compiles
      # every target; the local pre-push also builds and tests the full UI app.
      # The explicit manifest profile omits only AegisMenuBarTests. Without it the
      # aggregate test product also compiles the UI. The default profile and the
      # local pre-push retain both complete suites. VAD uses its real ONNX helper.
      - name: Build VAD helper
        run: swift build --build-system native --product jarvis-vad-helper
      - name: Build AegisAudioCore tests
        run: swift build --build-system native --product AegisAudioPackageTests
      - name: Run AegisAudioCore tests
        run: swift test --build-system native --skip-build --filter AegisAudioCoreTests
