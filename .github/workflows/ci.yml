name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python lint and tests
    # The daemon relies on Darwin-only APIs (LOCAL_PEERCRED, Keychain paths).
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python 3.11
        run: uv python install 3.11
      - name: Sync dependencies
        run: uv sync --locked --group dev --python 3.11
      - name: Ruff
        run: uv run ruff check src tests
      - name: Pytest
        run: uv run pytest -q

  swift:
    name: Swift core tests
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: native/AegisAudio
    steps:
      - uses: actions/checkout@v4
      - name: Select latest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - name: Build and test AegisAudioCore
        run: swift test --filter AegisAudioCoreTests
