name: Diagnóstico focal de medios de Jarvis

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Runner oficial para el diagnóstico focal
        type: choice
        required: true
        default: xcode-27
        options:
          - xcode-27
          - macos-26
      xcode:
        description: Xcode para el diagnóstico focal
        type: choice
        required: true
        default: predeterminado
        options:
          - predeterminado
          - '27.2'

permissions:
  contents: read

concurrency:
  group: jarvis-media-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  media:
    name: Texto PDF e imágenes y vídeo reales, diagnóstico focal
    runs-on: ${{ inputs.runner == 'macos-26' && 'macos-26' || 'xcode-27' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Seleccionar el mínimo del runner oficial
        id: runner_selection
        shell: bash
        env:
          JARVIS_CI_RUNNER_CHOICE: ${{ inputs.runner }}
          JARVIS_CI_XCODE_CHOICE: ${{ inputs.xcode }}
        run: |
          case "$JARVIS_CI_RUNNER_CHOICE:$JARVIS_CI_XCODE_CHOICE" in
            xcode-27:predeterminado|xcode-27:27.2)
              printf '%s\n' 'JARVIS_CI_MINIMUM_MAJOR=27' >> "$GITHUB_ENV"
              ;;
            macos-26:predeterminado)
              printf '%s\n' 'JARVIS_CI_MINIMUM_MAJOR=26' >> "$GITHUB_ENV"
              ;;
            *)
              printf '%s\n' 'La combinación de runner y Xcode no está admitida.' >&2
              exit 2
              ;;
          esac
      - name: Seleccionar Xcode para el diagnóstico
        id: xcode_selection
        shell: bash
        env:
          JARVIS_CI_XCODE_CHOICE: ${{ inputs.xcode }}
        run: |
          case "$JARVIS_CI_XCODE_CHOICE" in
            predeterminado) ;;
            27.2)
              if ! test -d '/Applications/Xcode_27.2.app/Contents/Developer'; then
                printf '%s\n' 'No está disponible el Xcode 27.2 solicitado.' >&2
                exit 2
              fi
              printf '%s\n' 'DEVELOPER_DIR=/Applications/Xcode_27.2.app/Contents/Developer' >> "$GITHUB_ENV"
              ;;
            *)
              printf '%s\n' 'La selección de Xcode no está admitida.' >&2
              exit 2
              ;;
          esac
      - uses: astral-sh/setup-uv@v7
      - name: Preparar dependencias del checkout exacto
        run: uv sync --locked --group dev --python 3.11
      - name: Acreditar el entorno macOS remoto
        run: >-
          .venv/bin/python -B script/check_macos_ci_environment.py
          --minimum-major "$JARVIS_CI_MINIMUM_MAJOR"
          --output "${{ runner.temp }}/Jarvis-media-probe-environment.json"
      - name: Diagnóstico focal supervisado, no cualificación completa
        shell: bash
        run: |
          set -o pipefail
          # --full admits the remote profile; selection and Swift filter remain focal.
          # The main workflow still performs every suite, build and installation smoke.
          .venv/bin/python -B script/test_resource_guard.py run \
            --profile ci --kind swift --full \
            --selection 'NativeMedia(Executor|Diagnostics)Tests' \
            --budget-mib 6144 --deadline 600 -- \
            .venv/bin/python -B script/test_resource_guard.py admitted-exec --kind swift -- \
            /bin/bash script/test_desktop.sh --guard-child \
            --filter 'NativeMedia(Executor|Diagnostics)Tests' \
            2>&1 | tee "$RUNNER_TEMP/jarvis-swift-diagnostic.log"
      - name: Conservar sólo el diagnóstico focal acotado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-media-probe-${{ github.sha }}
          path: ${{ runner.temp }}/jarvis-swift-diagnostic.log
          if-no-files-found: error
          retention-days: 3
