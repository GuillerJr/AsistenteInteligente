[project]
name = "aegis-swarm"
version = "0.1.0"
description = "Local-first, policy-gated agent swarm for macOS Apple Silicon"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "aiohttp>=3.12,<4",
  "cryptography>=45,<47",
  "httpx>=0.28,<1",
  "jsonschema>=4.25,<5",
  "langgraph>=0.6,<1",
  "mlx-whisper==0.4.3",
  "psutil>=7,<8",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "sqlite-vec==0.1.8",
]

[project.optional-dependencies]
distributed = [
  "mlx>=0.29,<1",
  "mlx-lm>=0.29,<1",
]

[project.scripts]
aegis = "aegis_core.cli:main"
jarvis = "aegis_core.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "respx>=0.22,<1",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
